# アプリ層のタイマ設定（§2.4 セッション終了の定義・アイドル時トリガー）。
# Core の判断ツマミ（config/thresholds.toml）とは別の引き出し。
# こちらは「Coreがどう考えるか」ではなく「アプリがいつ声をかけるか」の設定。
# 変更時は docs/archive/DECISIONS.md に理由を記録すること。
#
# 心拍(heartbeat)による GUI終了検知(旧トリガー1)は2026-07-12に廃止した。
# 心拍pingは会話の有無と無関係に一定間隔で送られ続けるため、無操作タイムアウトの
# 300秒到達に常に先勝ちされる死に枝だったと実機確認で判明（DECISIONS参照）。

[idle]
# 最後の発話からこの秒数無操作が続いたらセッション終了とみなす（唯一の自動終了トリガー。
# 明示の別れの挨拶は別経路）。5分(マスター指定)。
timeout_after_seconds = 300
# 会話の合間、この秒数アイドルが続いたら宿題箱の小分け消化(②)を試みる。
digest_gap_seconds = 60
# 見回りスレッドがこれらの判定を回す間隔。
poll_interval_seconds = 20
# 1回の見回りで消化する蒸留ジョブの件数(§2.4「1〜2件ずつ内職」)。
digest_chunk_limit = 1
# life/ 一方向出力の最短間隔（秒）。ウォーターフォール末尾が毎ティック走らないようにする。
export_life_min_interval_seconds = 300

[gpu]
# GPU使用率がこの値(%)を超えていたら裏方便の発注を見送る(§2.4 GPU見送り判定)。
# 40%だと軽いゲーム負荷(20〜30%)にAuroraの瞬間的な張り付き(実測100%)が重なりカクつく
# ことが実機で確認されたため15%へ引き下げ(2026-07-12実測・マスター指定)。
# 2026-07-18: 完全アイドル時にも査定が進まなかった事例があり、GPU番人は原因ではなさそうと
# マスター判断（本命は別要因＝Ollama読取タイムアウト絡みの先頭詰まりの疑い、DECISIONS参照）。
# 誤検知でのスキップを減らす目的で25%へ引き上げ(マスター指定)。
busy_threshold_percent = 25.0

[chores]
# 蒸留・機微査定ジョブがこの回数連続で失敗したら車線振替（cloud→local）を試み、
# それでも失敗するなら棚上げ棚へ移動する(2026-07-12決定。毒饅頭ジョブの先頭詰まり対策。
# DECISIONS参照)。
failure_shelve_threshold = 3
