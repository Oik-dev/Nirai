# アプリ層のタイマ設定（§2.4 セッション終了の定義・アイドル時トリガー）。
# Core の判断ツマミ（config/thresholds.toml）とは別の引き出し。
# こちらは「Coreがどう考えるか」ではなく「アプリがいつ声をかけるか」の設定。
# 変更時は docs/DECISIONS.md に理由を記録すること。

[heartbeat]
# クライアント(ブラウザ)が挙手ping(/api/heartbeat)を送る間隔の目安。app.js側の定数と合わせる。
client_interval_seconds = 20
# 挙手が途絶えてからこの秒数でGUI終了(トリガー1)とみなす。
# ブラウザはバックグラウンドタブのタイマーを最大1分間隔まで間引くため、
# 誤検知(タブを裏に回しただけ)を避けるための余裕を持たせる(5分)。
lost_after_seconds = 300

[idle]
# 挙手はあるが会話が止まっている状態がこの秒数続いたら無操作タイムアウト(トリガー2)とみなす。
# 心拍途絶(トリガー1)と同じく5分(マスター指定)。
timeout_after_seconds = 300
# 会話の合間、この秒数アイドルが続いたら宿題箱の小分け消化(②)を試みる。
digest_gap_seconds = 60
# 見回りスレッドがこれらの判定を回す間隔。
poll_interval_seconds = 20
# 1回の見回りで消化する蒸留ジョブの件数(§2.4「1〜2件ずつ内職」)。
digest_chunk_limit = 1

[gpu]
# GPU使用率がこの値(%)を超えていたら裏方便の発注を見送る(§2.4 GPU見送り判定)。
busy_threshold_percent = 40.0
