# Core が使う数値ツマミ（設計書v2 §5.5-3: ハードコード禁止）
# 変更時は docs/DECISIONS.md に理由を記録すること

# 付箋種類ごとの確信度足切り閾値（§2.5 関所②）。未登録の種類は default を使う。
[fusen_confidence]
default = 0.5
"心の動き" = 0.5
"マスター観測" = 0.5
"記憶候補" = 0.6
"センシティブ観測" = 0.5
"交代要請" = 0.5
"道具使用" = 0.0

# 気分層の急変防止弁（§2.3）。1ターンあたりの最大変化幅（プルチック各軸、値域は-1.0〜1.0想定）。
[mood_guard]
max_delta_per_turn = 0.1

# Aurora通訳の二段方式（§5.5-7）。2回目(付箋抽出)が書式崩れで失敗した際のリトライ回数。
[aurora]
extraction_max_retries = 3
# Ollama /api/generate のHTTPタイムアウト秒（実測約93秒/ターンに余裕を持たせる）。
request_timeout_seconds = 180

# 文脈パックの直近会話窓（§1.4: Brainごとの詰め物の量はCoreが調整）。
# 1会話=マスター発言+セリナ返答=2ターン。small≈12会話、large≈32会話。
[context]
recent_turns_small = 24
recent_turns_large = 64

# 記憶候補の審査ライン（§2.5, §4.1, §4.3）。
[memory]
# 重複チェックの類似度閾値。旧「dedup閾値0.92」はツマミへ降格（§4.3）。
dedup_threshold = 0.92
# 1蒸留ジョブ（会話断片）あたりの記憶化件数上限（§2.5）。
max_candidates_per_job = 5

# GeminiアダプタのHTTPタイムアウト秒。
[gemini]
request_timeout_seconds = 30

# 埋め込み(bge-m3)のHTTPタイムアウト秒。
[embedder]
request_timeout_seconds = 30

# 裏方便・宿題箱（§2.4）。
[chores]
# 蒸留の宿題を積む単位（会話ターン数）。「小分けが大原則」— 器（Brainの文脈容量）に収まる細切れ単位でのみ発注する。
fragment_turns = 20
