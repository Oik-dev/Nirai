# Core が使う数値ツマミ（設計書 §5.5-3: ハードコード禁止）
# 変更時は docs/archive/DECISIONS.md に理由を記録すること

# 付箋種類ごとの確信度足切り閾値（§2.5 関所②）。未登録の種類は default を使う。
[fusen_confidence]
default = 0.5
"心の動き" = 0.5
"マスター観測" = 0.5
"記憶候補" = 0.6
"センシティブ観測" = 0.5
"交代要請" = 0.5
"道具使用" = 0.0

# 気分層の急変防止弁（§2.3）。1ターンあたりの最大変化幅（プルチック各軸、値域は-1.0〜1.0想定）。
[mood_guard]
max_delta_per_turn = 0.1

# Aurora通訳の二段方式（§5.5-7）。2回目(付箋抽出)が書式崩れで失敗した際のリトライ回数。
[aurora]
extraction_max_retries = 3
# 機微査定(§4.6-3)のJSON取得リトライ回数。会話の付箋抽出と同じ「RP特化は書式が苦手」前提。
assessment_max_retries = 3
# Ollama /api/generate のHTTPタイムアウト秒（実測約93秒/ターンに余裕を持たせる）。
request_timeout_seconds = 180

# 文脈パックの直近会話窓（§1.4: Brainごとの詰め物の量はCoreが調整）。
# 1会話=マスター発言+セリナ返答=2ターン。small≈12会話、large≈32会話。
[context]
recent_turns_small = 24
recent_turns_large = 64

# 記憶候補の審査ライン（§2.5, §4.1, §4.3）。
[memory]
# 重複チェックの類似度閾値。旧「dedup閾値0.92」はツマミへ降格（§4.3）。
dedup_threshold = 0.92
# 1蒸留ジョブ（会話断片）あたりの記憶化件数上限（§2.5）。
max_candidates_per_job = 5
# 関所④引用照合の最低文字数（2026-07-13追加、serina-code-reviewer Important指摘I-3）。
# 極端に短い引用（例:「。」1文字）はほぼ全ターンに部分一致してしまい、捏造content混入の
# 機械式ゲートが素通りになるため、最低文字数未満の引用は無条件で却下する。
min_quote_length = 8

# 想起の活性化モデル（§4.4 2026-07-17改訂）。
# 活性化値 = 基礎活性(重要度+鮮度+等級A/Sの下駄) + 話題近接 + 連想伝播 + ゆらぎ。
# 具体値は正典で固定せず、tests/eval_recall.py の複数回試行ヒット率（目標90%以上）で実測調整する。
[recall]
weight_relevance = 0.6      # 話題近接の配点。全部品中で最大を維持すること（§4.4付帯ルール）
weight_importance = 0.15
weight_recency = 0.05
grade_bonus_s = 0.25        # 保護等級S（正典級）の下駄（2026-07-17実測: 0.15では近縁B等級の
                             # 密集クラスタに埋もれるケースがあり0.25へ引き上げ）
grade_bonus_a = 0.20        # 保護等級A（約束・日記級）の下駄
spread_decay = 0.5          # 連想伝播の減衰。1ホップで元の半分目安
spread_seeds = 3            # 伝播の起点にする一次発火の上位件数
noise_sigma = 0.02          # ゆらぎ（正規乱数の幅）。0で決定論に戻る
activation_floor = 0.5      # 足切り。未満は件数枠が余っても浮上しない

# GeminiアダプタのHTTPタイムアウト秒。
[gemini]
request_timeout_seconds = 30

# 埋め込み(bge-m3)のHTTPタイムアウト秒。
[embedder]
request_timeout_seconds = 30

# 裏方便・宿題箱（§2.4）。
[chores]
# 蒸留の宿題を積む単位（会話ターン数）。「小分けが大原則」— 器（Brainの文脈容量）に収まる細切れ単位でのみ発注する。
fragment_turns = 20

# 感情状態→自然文変換の閾値ラベル（§1.5 段⑤新設・§2.3 表現の分担）。
# 生数値をそのままBrainへ渡さず、Core側で決定論的に意訳するための境界値。
# 実機で声の温度を見ながら調整する想定（コード変更なしで回せるようにする）。
[emotion_render]
ignore_below = 0.15
mild_below = 0.4
strong_below = 0.7
affect_top_n = 2
