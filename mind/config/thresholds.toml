# Core が使う数値ツマミ（設計書 §5.5-3: ハードコード禁止）
# 変更時は docs/archive/DECISIONS.md に理由を記録すること

# 文脈パックの直近会話窓（§1.4: Brainごとの詰め物の量はCoreが調整）。細かめ要約が届く前だけ原文を載せる。
# 1会話=マスター発言+セリナ返答=2ターン。small≈12会話、large≈32会話。
[context]
recent_turns_small = 24
recent_turns_large = 64
# §1.5 ④粗い要約 / ⑦細かめ要約（二段更新）
fine_band_turns = 20
coarse_update_every_n_turns = 10

# 通訳アダプタのOllama /api/generate HTTPタイムアウト秒。
# 2026-07-25: 対話モデルをGemma4-26B-A4B-uncensoredへ移行（serina-model-decision-gemma4）。
# 値は旧Qwen3.5実測のまま流用。Gemma4はcontext長262144と余裕があるがVRAM制約（8GB恒久制約）優先でnum_ctxは維持。
# 実会話での速度実測はTODO（本移行の検証ステップで確認予定）。
# §6-1実機スモーク: 通常時15〜21秒/ターン・初回ロードのみ+72秒。
# 2026-07-18実装時の追加実機確認: 暖機後16.1秒（ledgerの実測と一致）は良好だが、
# 完全コールドロード（Ollama起動直後・モデル未ロード状態からの初回呼び出し）は
# 実測で180秒を超過する事例を観測（curl実測で約122秒だが、直前の失敗呼び出しが
# サーバ側で処理を継続していた可能性もあり厳密な単独計測ではない）。180秒では
# コールド時に「セリナは沈黙しない」の最終防衛線（機械的な既定応答）に落ちる
# リスクがあるため、余裕を持たせ240秒に設定する。
[ollama]
request_timeout_seconds = 240
# 対話コンテキスト長。VRAM 既定依存禁止のため options.num_ctx で明示（§3.1）。
num_ctx = 8192
# Windows + CUDA の Ollama 0.33.3 は既定で mmap を切るため、モデルをPrivateへ全載せして
# メモリを圧迫する。E1実測で mmap 有効時は仮想メモリ枯渇を再現しなかったため明示する。
use_mmap = true

# 能動 Pulse（§2.8）。発火判定は決定論、文面は Brain 生成。
# いつ会いに行きたくなるか（人恋しさ）は [feeling] の lonely_below。ここは来てよい時間帯と間隔の安全柵。
[pulse]
active_hour_start = 8
active_hour_end = 22
same_kind_gap_seconds = 10800       # 同種3時間
min_interval_seconds = 3600         # 最短1時間（種別を問わず）
late_night_start = 23
late_night_end = 7

# 人格の刃（§2.9）。安全フィルタ時の見えるブレーキ。
[persona_blade]
visible_brake_mode = "parenthetical"   # none | parenthetical | suffix

# 埋め込み(bge-m3)のHTTPタイムアウト秒。
[embedder]
request_timeout_seconds = 30

# 外聞き（Gemini アドバイザー §5.6）。1ターンの相談合計時間予算（秒）。
# 2件目以降は経過がこの予算未満のときだけ開始する（実行中の1件は中断しない）。
[advisor]
turn_budget_seconds = 180

# 眠りのあとの人格の見直し（§4.3）: 材料にする直近の日記の数 / JSON取得リトライ（1日1回まで）
[chores]
persona_propose_diary_limit = 3
persona_propose_max_retries = 3

# 気持ち（設計書 §2.3。core/feeling/）。体の芯は快・不快（-1〜1）と高ぶり（0〜1）、それとつながり（0〜1）。
# 脳は評価を選択肢で答えるだけで、数はここの対応表で仕組みが決める。正本はここだけ（core/config.py に既定値を持たない）。
# 2026-10-06 の初めの値。時定数は前の仕組み（情動 約2時間・気分 約3日）を引き継いだ。実機で Master が話して確かめながら直す。
[feeling]
tau_fast_seconds = 7200            # 今の芯のずれが平常へ戻る速さ（約2時間）
tau_slow_seconds = 259200          # 気分のずれが平常へ戻る速さ（約3日）
slow_share = 0.15                  # 1つの出来事の動きのうち、気分へ入る割合（余韻。次の日まで少し残る）
tau_connection_seconds = 86400     # つながりが会えない時間で減る速さ（約1日。3日ほどでほぼ空になる）
initial_connection = 0.5           # 気持ちの記録がまだないときのつながり
temperament_valence = 0.15         # 気質：満たされているときの快・不快の平常
loneliness_valence = 0.3           # つながりが空のとき、快・不快の平常がこれだけ下がる
arousal_mid = 0.4                  # 1日のリズム：高ぶりの平常の真ん中
arousal_swing = 0.15               # 1日のリズムの振れ幅
arousal_peak_hour = 14             # 高ぶりの平常がいちばん高い時刻（日本時間。真夜中の2時がいちばん低い）
meeting_valence = 0.5              # つながりが満ちた分・欠けた分が、快・不快へ響く強さ（久しぶりほどうれしい）
# 文脈パックの⑤に載せる「体の感じ」の言葉の境目（数は載せない）
bright_above = 0.25                # 快・不快がこれ以上なら「明るい」
dim_below = -0.2                   # これ以下なら「沈んでいる」
stirred_above = 0.65               # 高ぶりがこれ以上なら「高ぶっている」
calm_below = 0.35                  # これ以下なら「落ち着いている」
sleepy_below = 0.3                 # 夜（1日のリズムの下り半分）にこれより低ければ「眠い」
lonely_below = 0.4                 # つながりがこれより低いと「人恋しい」。Pulse で本人から会いに行く
flow_items = 3                     # 気持ちの流れとして載せる、直近の本人の言葉の数
master_state_stale_after_seconds = 21600  # これより古いマスターの様子の見立ては載せない（6時間。古い見立てを今と誤読させない）

# 評価の選択肢 → 動き。+は上の端（快・高ぶり・満ちる）へ、-は下の端へ。大きさは、今の値から端までの残りの割合。
[feeling.valence]
"とても嫌" = -0.5
"嫌" = -0.25
"どちらでもない" = 0.0
"うれしい" = 0.25
"とてもうれしい" = 0.5

[feeling.arousal]
"落ち着いた" = -0.15
"少し動いた" = 0.2
"大きく動いた" = 0.5

# Masterと話したこと自体でつながりは少し満ちる（変わらない）。評価を聞けなかったターンも「変わらない」として残る。
[feeling.distance]
"近づいた" = 0.6
"変わらない" = 0.25
"離れた" = -0.35

# 長期記憶の想起（設計書 §4。core/memory/recall.py・strength.py）。
# 活性 = 基礎活性 + 拡散活性 + 意味の近さ + 時の手がかり + ゆらぎ。閾値を超えたものだけが浮かぶ。ツマミの正本はここだけ。
# 2026-10-03 の M3 で、Serinaの記憶テストを、問題の数で重みを付けた当たりの平均で比べて決めた（★の項目）。
# 問題を半分ずつに分けても同じ傾向だった（79%と76%）。★のない項目は、決め打ちのまま測っていない。
[activation]
threshold = 1.5           # ★これを超えたものだけが浮かぶ（自然に浮かぶとき）
intent_relief = 2.0       # ★思い出そうとしているとき（「覚えてる？」「〜っけ」）に下げる閾値の幅（閾値は-0.5になる）
max_spontaneous = 2       # ★自然に浮かぶ数の上限
max_intentional = 4       # ★思い出そうとしたときに浮かぶ数の上限
spread_strength = 2.5     # ★S：つながりが1本だけの手がかりの強さ（S - ln(つながりの数)）
spread_weight = 2.0       # 今の発言の手がかりが持つ注意の総量
recent_weight = 1.0       # ★直前の会話の手がかりが持つ注意の総量（0にすると続きの話が62%→48%）
literal_share = 0.5       # ★言葉の手がかりの、概念の手がかりに対する注意の割合（0にすると正面からが78%→69%）
semantic_weight = 10.0    # ★意味の近さ（bge-m3）の重み
semantic_center = 0.5     # ★この近さで、意味の近さの寄与が0
recent_turns = 2          # 意味の近さに使う直前の会話の数
time_weight = 2.0         # 時の手がかりに合うページに足す強さ（ぼんやりした時期は半分）
noise = 0.15              # ゆらぎ（ロジスティック分布の幅）
vivid_margin = 1.0        # 閾値をこれだけ超えたら、はっきり思い出す（本文まで渡す）
vivid_chars = 420         # はっきり思い出したときに渡す本文の長さ
faint_chars = 120         # うっすら思い出したときに渡す要点の長さ
decay_floor = 0.15        # ★痕跡の減衰（ACT-R の d の下限）。0.3だと1年半前の記憶が届かなかった
decay_scale = 0.2         # 思い出した時の活性が高いほど、その痕跡は速く減衰する（Pavlik & Anderson の c）
decay_max = 1.0           # 減衰の上限
importance_weight = 0.5   # ★本人がつけた大事さの順位の効き方。脳の数は高めに偏るので控えめに
arousal_weight = 0.5      # ★心の動きの順位の効き方
min_age_days = 0.0416667  # これより近い痕跡は、この古さ（1時間）として扱う
