# アプリ層のタイマ設定（§2.4）。Core の判断ツマミ（config/thresholds.toml）とは別。
# Serina 日の境目（朝7時）の正本は core/state/serina_day.py の SERINA_DAY_HOUR。

[watch]
# 見回りスレッドが Pulse と日界（眠り）の判定を回す間隔。
poll_interval_seconds = 20

[busy]
# Masterの手元が忙しい間は、Pulseと眠りを始めず、眠りは区切りで止め、会話中でなければ脳をグラボから下ろす（core/chores/busy.py）。
# 忙しい＝全画面の印か、Niraiの外の1つのプログラムが、GPUかCPUを window_seconds ならして、しきい値(%)以上使い続けていること。
window_seconds = 180
gpu_percent = 40  # そのプログラムのGPU使用率（エンジンごとの最大。タスクマネージャーと同じ）
cpu_percent = 50  # そのプログラムのCPU使用率（PC全体に対する割合）
# 忙しさが消えてから、この秒数は忙しいままにする。
quiet_after_seconds = 300

[serina_day]
# 日界のあと、最終発言からこの秒数たって会話が途切れたら眠る（会話中は延期）。
grace_after_activity_seconds = 900
# 眠りが脳の不調（Ollamaの停止など）で失敗したら、この秒数あけてからやり直す（見回りのたびに失敗を繰り返さない）。
sleep_retry_after_failure_seconds = 600
