<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serina</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <div id="sidebar-top">
      <button id="btn-new-session" class="nav-btn nav-btn-primary" type="button">＋ 新しい会話</button>
    </div>
    <div id="shelved-notice" class="hidden"></div>
    <div class="nav-label">会話履歴</div>
    <div id="session-list"></div>

    <div id="sidebar-foot" title="ONにすると、セリナからの自発的な声かけ（放置時間・気分の変化がきっかけ）を止める。いつでもここで戻せる。">
      <span id="away-label" class="foot-label">長期離席</span>
      <button id="away-switch" class="switch" type="button" role="switch" aria-checked="false">
        <span class="switch-knob"></span>
      </button>
    </div>
  </aside>

  <main id="main">
    <div id="readonly-bar" class="hidden">
      過去の会話を表示中（読み取り専用）
      <button id="btn-back">今日の会話へ戻る</button>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="セリナに話しかける…（Enterで送信 / Shift+Enterで改行）"></textarea>
      <button id="btn-send">送信</button>
    </div>
  </main>
</div>

<div id="context-menu" class="hidden">
  <button type="button" id="ctx-delete-msg">削除</button>
</div>

<script src="app.js"></script>
</body>
</html>
