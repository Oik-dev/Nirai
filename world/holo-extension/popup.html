<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Nirai Holo</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 320px; margin: 12px; color: #1d2b36; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    h2 { font-size: 13px; margin: 12px 0 5px; }
    p { margin: 6px 0; }
    .muted { color: #5b6b78; }
    .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-top: 1px solid #e6ebef; }
    .row:first-child { border-top: 0; }
    .right { text-align: right; }
    .room { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .room .state { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room button { width: auto; margin: 0; }
    .room .go { min-width: 64px; }
    .problem { color: #b3261e; }
    button { width: 100%; margin: 6px 0; padding: 6px; }
  </style>
</head>
<body>
  <h1>Holoの部屋</h1>
  <p id="post" class="muted">郵便局を確かめています…</p>
  <div id="rooms" class="muted">確かめています…</div>
  <p id="message" class="muted"></p>
  <h2>チームの郵便受け</h2>
  <div id="team" class="muted">確かめています…</div>
  <button id="usage">使った量を見る</button>
  <script src="popup.js"></script>
</body>
</html>
