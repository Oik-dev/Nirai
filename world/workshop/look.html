<!doctype html>
<meta charset="utf-8">
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/examples/jsm/": "/node_modules/three/examples/jsm/",
    "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
    "@pixiv/three-vrm-animation": "/node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
  }
}
</script>
<canvas id="view" width="300" height="360"></canvas>
<canvas id="sheet"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin } from '@pixiv/three-vrm-animation';
import { Body } from '/body/body.js';
import { motionClip, parseMotion } from '/body/motions.js';
import { WATER_OPTICS } from '/sea/optics.js';
import { placeAt } from '/body/place.js';
import { createGateSampler } from '/body/gate-samples.js';

const post = (path, body) => fetch(path, { method: 'POST', body });
const FPS = 30, COLUMNS = 8, W = 300, H = 360;
const VIEWS = [
  { label: '斜め前', offset: new THREE.Vector3(2.0, 1.2, 2.4) },
  { label: '横', offset: new THREE.Vector3(3.2, 0.6, 0) },
];
try {
  const view = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ canvas: view, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fc3d8);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a60, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1, 3, 2); scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0xd8c9a3 }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const grid = new THREE.GridHelper(40, 160, 0x7a6a50, 0xa89878); grid.position.y = 0.002; scene.add(grid);
  const camera = new THREE.PerspectiveCamera(35, W / H, 0.05, 100);

  const loader = new GLTFLoader();
  loader.register(parser => new VRMLoaderPlugin(parser));
  loader.register(parser => new VRMAnimationLoaderPlugin(parser));
  const vrm = (await loader.loadAsync('/model.vrm')).userData.vrm;
  VRMUtils.rotateVRM0(vrm);
  const modelBox = new THREE.Box3().setFromObject(vrm.scene);
  const root = new THREE.Group();
  root.scale.setScalar(1.55 / (modelBox.max.y - modelBox.min.y));
  vrm.scene.position.y -= modelBox.min.y;
  root.add(vrm.scene);
  scene.add(root);
  const body = new Body(vrm, root);
  const names = Object.keys(vrm.humanoid.humanBones).filter(name => vrm.humanoid.getRawBoneNode(name));
  const at = name => vrm.humanoid.getRawBoneNode(name).getWorldPosition(new THREE.Vector3());
  const settle = () => { vrm.update(0); root.updateMatrixWorld(true); };
  body.pose.apply(); settle();
  const sampler = createGateSampler(THREE, vrm, WATER_OPTICS.floorY);
  const { rest, soles } = sampler;
  await post('/log', 'soles ' + Object.entries(soles).map(([name, picks]) => `${name}=${picks.length}(${Math.min(...picks.map(c => c.p[1])).toFixed(3)}m)`).join(' '));
  await post('/log', `model metaVersion=${vrm.meta?.metaVersion} leftFoot.x=${rest.leftFoot?.[0].toFixed(3)} hips.y=${rest.hips[1].toFixed(3)}`);

  const sheet = document.getElementById('sheet');
  for (const file of await (await fetch('/clips.json')).json()) {
    const activity = ({ '泳ぐ.vrma': '海の中を泳ぐ', '浮く.vrma': '水面の近くで漂う', '座る.vrma': '砂地で休む', '眠る.vrma': '居場所でくつろぐ' })[file];
    const target = placeAt({ name: activity, since: null, from: null }, 0, { x: 0, y: 1.4, z: 3.65, yaw: 0 });
    const animation = await parseMotion(new Uint8Array(await (await fetch('/vrma/' + file)).arrayBuffer()));
    const clip = motionClip(file, animation, vrm);
    const mixer = body.mixer;
    const action = mixer.clipAction(clip);
    action.setLoop(THREE.LoopOnce); action.clampWhenFinished = true; action.play();
    const frames = Math.round(clip.duration * FPS) + 1;
    const pose = frame => {
      root.position.set(0, target.y - .85, 0); root.quaternion.identity();
      mixer.setTime(Math.min(frame / FPS, clip.duration));
      body.pose.apply(); settle();
      root.position.y += body.floorLift();
      settle();
    };

    const stem = file.replace(/\.vrma$/, '');
    await post(`/save/${stem}.samples.json`, JSON.stringify(sampler.sample(FPS, frames, pose)));

    // 終端まで採取した LoopOnce は paused になる。シート描画前に巻き戻して再生可能に戻す。
    action.reset().play();
    sheet.width = W * COLUMNS; sheet.height = H * VIEWS.length;
    const draw = sheet.getContext('2d');
    for (let column = 0; column < COLUMNS; column++) {
      const frame = Math.round(column * (frames - 1) / (COLUMNS - 1));
      pose(frame);
      const hips = at('hips');
      const target = new THREE.Vector3(hips.x, Math.max(0.35, hips.y * 0.75), hips.z);
      VIEWS.forEach((v, row) => {
        camera.position.copy(target).add(v.offset); camera.lookAt(target);
        renderer.render(scene, camera);
        draw.drawImage(view, column * W, row * H);
        draw.fillStyle = '#000'; draw.font = '16px sans-serif';
        draw.fillText(`${stem} ${(frame / FPS).toFixed(2)}s ${v.label}`, column * W + 6, row * H + 18);
      });
    }
    await post(`/save/${stem}.png`, sheet.toDataURL('image/png').split(',')[1]);
    action.stop(); mixer.uncacheAction(clip);
    await post('/log', `${stem}: ${frames} frames, ${clip.duration.toFixed(2)}s`);
  }
  // 入りの動きから座る輪へのつなぎを、本物と同じBodyで時刻別に並べる。
  // 窓は起こさず、使い捨てのユメカだけを使用する。
  const checks = await (await fetch('/clips.json')).json();
  if (checks.includes('腰を下ろす.vrma') && checks.includes('座る.vrma')) {
    let currentTime = 0;
    const arriving = new Body(vrm, root, () => currentTime);
    await arriving.loadActivities();
    const departure = Date.parse('2026-10-08T12:00:00Z');
    const activity = { name: '砂地で休む', since: new Date(departure).toISOString(),
      from: { name: '海の中を泳ぐ', since: new Date(departure - 60_000).toISOString() } };
    const arrivedAt = placeAt(activity, departure + 60_000, { x: 0, y: 1.4, z: 3.65, yaw: 0 }).arrivedAt;
    arriving.setLife({ activity, asleep: false });
    const points = [-.2, 0, .2, .5, 1.0, 1.28, 1.75, 2.4];
    sheet.width = W * COLUMNS; sheet.height = H * VIEWS.length;
    const draw = sheet.getContext('2d');
    for (let column = 0; column < points.length; column++) {
      currentTime = arrivedAt + points[column] * 1000;
      arriving.update(0, camera, false);
      const hips = at('hips');
      const target = new THREE.Vector3(hips.x, Math.max(.35, hips.y * .75), hips.z);
      for (let row = 0; row < VIEWS.length; row++) {
        const v = VIEWS[row];
        camera.position.copy(target).add(v.offset); camera.lookAt(target);
        renderer.render(scene, camera);
        draw.drawImage(view, column * W, row * H);
        draw.fillStyle = '#000'; draw.font = '16px sans-serif';
        draw.fillText(`着地 ${points[column].toFixed(2)}s ${v.label}`, column * W + 6, row * H + 18);
      }
    }
    await post('/save/着地から座る.png', sheet.toDataURL('image/png').split(',')[1]);
    arriving.dispose();
  }
  // D0 寝転ぶ: 本物のBodyで座位から眠り、同じ動きを逆向きに起き上がるまで見る。
  if (checks.includes('座る.vrma') && checks.includes('寝転ぶ.vrma') && checks.includes('眠る.vrma')) {
    let now = 1_000_000;
    const resting = new Body(vrm, root, () => now);
    await resting.loadActivities();
    const activity = { name: '砂地で休む', since: null, from: null };
    const awake = { activity, asleep: false };
    const asleep = { activity, asleep: true };
    resting.setLife(awake);
    const checkpoints = [0, 1.05, 2.7, 4.85, 5.4, 6.05, 8, 10.05];
    sheet.width = W * checkpoints.length;
    sheet.height = H * VIEWS.length;
    const draw = sheet.getContext('2d');
    for (const [column, seconds] of checkpoints.entries()) {
      now = 1_000_000 + seconds * 1000;
      if (column === 1) { now = 1_001_000; resting.setLife(asleep); now = 1_001_050; }
      if (column === 5) { now = 1_006_000; resting.setLife(awake); now = 1_006_050; }
      resting.update(0, camera, false);
      const hips = at('hips');
      const target = new THREE.Vector3(hips.x, Math.max(.35, hips.y * .75), hips.z);
      for (const [row, v] of VIEWS.entries()) {
        camera.position.copy(target).add(v.offset); camera.lookAt(target);
        renderer.render(scene, camera);
        draw.drawImage(view, column * W, row * H);
        draw.fillStyle = '#000'; draw.font = '16px sans-serif';
        draw.fillText(`${seconds.toFixed(2)}s ${v.label}`, column * W + 6, row * H + 18);
      }
    }
    await post('/save/座るから寝て起きる.png', sheet.toDataURL('image/png').split(',')[1]);
    resting.dispose();
  }
  // 伸びは活動の姿勢と同じAnimationMixerで混ざる。立位・座位・泳ぎを実体で見比べる。
  if (checks.includes('伸び.vrma')) {
    const mixer = body.mixer;
    const loadClip = async name => motionClip(name, await parseMotion(new Uint8Array(
      await (await fetch('/vrma/' + name + '.vrma')).arrayBuffer())), vrm);
    const stretch = await loadClip('伸び');
    const variants = [
      { label: '立位', base: null },
      { label: '座位', base: '座る' },
      { label: '泳ぎ', base: '泳ぐ' },
    ];
    sheet.width = W * COLUMNS;
    sheet.height = H * variants.length;
    const draw = sheet.getContext('2d');
    for (const [row, variant] of variants.entries()) {
      const baseClip = variant.base ? await loadClip(variant.base) : null;
      const baseAction = baseClip ? mixer.clipAction(baseClip) : null;
      if (baseAction) baseAction.setLoop(THREE.LoopRepeat).setEffectiveWeight(1).play();
      const stretchAction = mixer.clipAction(stretch);
      stretchAction.reset().setLoop(THREE.LoopOnce, 1).setEffectiveWeight(1).play();
      for (let column = 0; column < COLUMNS; column++) {
        const time = column * stretch.duration / (COLUMNS - 1);
        mixer.setTime(time);
        root.position.set(0, .55, 0);
        root.quaternion.identity();
        body.pose.apply();
        settle();
        root.position.y += body.floorLift();
        settle();
        const hips = at('hips');
        const target = new THREE.Vector3(hips.x, Math.max(.35, hips.y * .75), hips.z);
        camera.position.copy(target).add(new THREE.Vector3(0, 1.2, 3));
        camera.lookAt(target);
        renderer.render(scene, camera);
        draw.drawImage(view, column * W, row * H);
        draw.fillStyle = '#000'; draw.font = '16px sans-serif';
        draw.fillText(`${variant.label} ${(time).toFixed(2)}s`, column * W + 6, row * H + 18);
      }
      stretchAction.stop();
      if (baseAction) { baseAction.stop(); mixer.uncacheAction(baseClip); }
    }
    mixer.uncacheAction(stretch);
    await post('/save/伸び-活動別.png', sheet.toDataURL('image/png').split(',')[1]);
  }
  await post('/done', 'ok');
} catch (error) {
  await post('/done', 'error ' + (error?.stack ?? error));
}
</script>
