<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nirai</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/examples/jsm/": "/node_modules/three/examples/jsm/",
      "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
      "@pixiv/three-vrm-animation": "/node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
    }
  }
  </script>
</head>
<body>
  <main id="world">
    <canvas id="worldCanvas" tabindex="0" aria-label="海の窓"></canvas>
    <div id="worldFallback" hidden>
      <img src="/assets/underwater-target.png" alt="">
      <p>海の描画を休んでいます。</p>
    </div>
    <div id="worldStatus" role="status">海をひらいています…</div>
    <button id="worldMotion" type="button" aria-pressed="false">動きを止める</button>
    <section id="chatPanel" aria-label="Serinaとの会話">
      <div id="chatResizeTop" class="chat-resize chat-resize-top" aria-hidden="true"></div>
      <div id="chatResizeRight" class="chat-resize chat-resize-right" aria-hidden="true"></div>
      <div id="chatResizeCorner" class="chat-resize chat-resize-corner" aria-hidden="true"></div>
      <div id="chatMessages" role="log" aria-live="polite" aria-relevant="additions text"></div>
      <form id="chatForm">
        <div id="mindStatus" class="mind-status" role="status"></div>
        <label class="sr-only" for="chatInput">Serinaへ話す</label>
        <textarea id="chatInput" rows="1" maxlength="12000" placeholder="話しかける"></textarea>
        <div class="chat-actions">
          <button id="chatMute" type="button" aria-pressed="false">静かに</button>
          <span id="chatStatus" role="status"></span>
          <button id="chatSend" type="submit">送る</button>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
